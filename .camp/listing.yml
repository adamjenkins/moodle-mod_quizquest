name: mod_quizquest
summary: 'An activity that presents question bank questions as an interactive, escape-room style quest, answered in a chat-like dialogue.'
description: |
  Students answer questions drawn at random from a configured question bank
  category in a chat-like dialogue, advancing a step for each correct answer
  until the quest is complete. The interface is adapted from AI Escape Room
  (`mod_aiescape`), with a question bank category taking the place of the AI.
  Supports multiple choice (single answer) and short answer questions.
